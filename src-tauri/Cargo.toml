[package]
name = "huephony"
version = "1.0.0"
description = "Huephony: room lighting and ambient display that follow the album artwork"
authors = ["Huephony contributors"]
repository = "https://github.com/spongyvertwastaken/huephony"
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "huephony_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
