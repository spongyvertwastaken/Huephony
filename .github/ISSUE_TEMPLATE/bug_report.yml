name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Huephony version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
  - type: input
    id: light
    attributes:
      label: Govee model and effect in use
      placeholder: H6008, Wave
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Scrub credentials, tokens and personal info first. Logs can include track names and device addresses.
