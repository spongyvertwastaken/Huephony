name: Check and build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Set up Rust
        run: rustup default stable-x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        run: npm.cmd ci
      - name: Create Python virtual environment
        run: npm.cmd run backend:venv
      - name: Install backend dependencies
        run: npm.cmd run backend:install
      - name: Check TypeScript and run backend tests
        run: npm.cmd test
      - name: Build Windows installer
        run: npm.cmd run desktop:build
      - uses: actions/upload-artifact@v7
        with:
          name: huephony-windows-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
